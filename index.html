<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b16">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Starship Tracker: siti, prototipi, test e lanci di SpaceX Starship, aggiornato ogni giorno con fonti.">
  <meta property="og:title" content="Starship Tracker">
  <meta property="og:description" content="Siti, prototipi, test e lanci di SpaceX Starship, con fonti e foto dal mondo X.">
  <meta property="og:type" content="website">
  <title>Starship Tracker</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" href="#" aria-label="Starship Tracker">
        <img src="favicon.svg" alt="" width="36" height="36">
        <span>Starship <b>Tracker</b></span>
      </a>
      <p class="updated" id="updated">Caricamento…</p>
    </div>
  </header>

  <main class="wrap" id="app">
    <noscript><p class="card">Serve JavaScript per mostrare i dati.</p></noscript>
    <section id="prossimo" class="block" aria-labelledby="h-prossimo"></section>
    <section id="notizie" class="block" aria-labelledby="h-notizie"></section>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Sezioni"></nav>
    <section id="sezione" class="block" role="tabpanel"></section>
    <section id="fonti" class="block"></section>
  </main>

  <footer class="wrap foot">
    <p>Solo fatti con data e fonte. Le voci «non confermato» vengono da fonti non ufficiali o community. Orari in ora di Roma. Immagini dai post pubblici su X, di proprietà dei rispettivi autori.</p>
  </footer>

  <dialog id="viewer" aria-label="Immagine ingrandita">
    <button class="viewer-close" type="button" aria-label="Chiudi">✕</button>
    <figure>
      <img id="viewer-img" alt="" referrerpolicy="no-referrer">
      <figcaption id="viewer-cap"></figcaption>
    </figure>
  </dialog>

  <script src="app.js" defer></script>
</body>
</html>
