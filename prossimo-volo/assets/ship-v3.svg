<svg xmlns="http://www.w3.org/2000/svg" viewBox="-290 -50 670 720" class="veh veh-ship" role="img" aria-label="Disegno di Starship V3 (Ship 42)">
  <defs>
    <linearGradient id="sh-steel" x1="0" x2="1">
      <stop offset="0" stop-color="#3b424c"/><stop offset=".45" stop-color="#7d8691"/><stop offset=".62" stop-color="#e9edf1"/>
      <stop offset=".72" stop-color="#f6f8fa"/><stop offset=".86" stop-color="#a7afb8"/><stop offset="1" stop-color="#3a4049"/>
    </linearGradient>
    <linearGradient id="sh-tile" x1="0" x2="1">
      <stop offset="0" stop-color="#050607"/><stop offset=".6" stop-color="#1c1f24"/><stop offset="1" stop-color="#2b2f35"/>
    </linearGradient>
    <pattern id="sh-hex" width="9" height="7.8" patternUnits="userSpaceOnUse">
      <path d="M0 3.9 L2.25 0 H6.75 L9 3.9 L6.75 7.8 H2.25 Z" fill="none" stroke="#3a3f47" stroke-width=".8"/>
    </pattern>
    <linearGradient id="sh-bell" x1="0" x2="1">
      <stop offset="0" stop-color="#25211e"/><stop offset=".45" stop-color="#8c7a69"/><stop offset=".65" stop-color="#5a4e45"/><stop offset="1" stop-color="#1b1815"/>
    </linearGradient>
    <linearGradient id="sh-flap" x1="0" x2="1">
      <stop offset="0" stop-color="#0b0c0e"/><stop offset="1" stop-color="#2a2e34"/>
    </linearGradient>
    <radialGradient id="sh-flame" cx=".5" cy="0" r="1">
      <stop offset="0" stop-color="#eef6ff"/><stop offset=".2" stop-color="#ffd58a"/><stop offset=".5" stop-color="#ff8a3d" stop-opacity=".8"/><stop offset="1" stop-color="#ff4d1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sh-plasma" x1="1" x2="0">
      <stop offset="0" stop-color="#ff6a2a" stop-opacity="0"/><stop offset=".6" stop-color="#ff7a33" stop-opacity=".55"/><stop offset="1" stop-color="#ffd1a1" stop-opacity=".9"/>
    </linearGradient>
    <filter id="sh-blur" x="-60%" y="-20%" width="220%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="sh-blur2" x="-100%" y="-10%" width="300%" height="120%"><feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="sh-hull"><path d="M0 500 V150 C0 70 25 18 45 0 C65 18 90 70 90 150 V500 Z"/></clipPath>
  </defs>

  <!-- plasma del rientro (visibile solo in rientro) -->
  <g class="plasma">
    <path d="M-6 520 V150 C-6 60 25 6 45 -10 L40 10 C22 40 0 90 0 150 V500 Z" fill="url(#sh-plasma)" filter="url(#sh-blur2)"/>
    <path d="M-30 540 V160 C-30 80 10 0 45 -30 L45 0 C25 18 0 70 0 150 V500 Z" fill="url(#sh-plasma)" opacity=".5" filter="url(#sh-blur2)"/>
  </g>

  <!-- fiamma -->
  <g class="flame">
    <ellipse cx="45" cy="610" rx="66" ry="85" fill="url(#sh-flame)" filter="url(#sh-blur)"/>
    <path d="M10 540 Q45 690 80 540 Z" fill="#cfe2ff" opacity=".5"/>
  </g>

  <!-- motori: 3 RVac esterni (2 visibili) e 3 a livello del mare (1 visibile) -->
  <path d="M4 500 h28 l6 42 h-40 z" fill="url(#sh-bell)"/>
  <path d="M58 500 h28 l4 42 h-40 z" fill="url(#sh-bell)"/>
  <path d="M36 500 h18 l2 24 h-22 z" fill="url(#sh-bell)"/>

  <!-- flap posteriori -->
  <path d="M0 395 L-30 418 L-32 488 L0 492 Z" fill="url(#sh-flap)" stroke="#40464e" stroke-width="1"/>
  <path d="M90 395 L114 416 L116 488 L90 492 Z" fill="#202429" stroke="#4a5058" stroke-width="1"/>

  <!-- scafo -->
  <g clip-path="url(#sh-hull)">
    <rect x="0" y="0" width="90" height="500" fill="url(#sh-steel)"/>
    <g stroke="#1d2228" stroke-opacity=".2" stroke-width="1">
      <path d="M0 172h90M0 194h90M0 216h90M0 238h90M0 260h90M0 282h90M0 304h90M0 326h90M0 348h90M0 370h90M0 392h90M0 414h90M0 436h90M0 458h90M0 480h90"/>
    </g>
    <path d="M0 150h90" stroke="#1d2228" stroke-opacity=".35" stroke-width="1.5"/>
    <!-- scudo termico lato sopravento -->
    <path d="M-2 -2 H40 C38 30 38 90 40 150 V502 H-2 Z" fill="url(#sh-tile)"/>
    <path d="M-2 -2 H40 C38 30 38 90 40 150 V502 H-2 Z" fill="url(#sh-hex)"/>
    <path d="M40 -2 C38 30 38 90 40 150 V502" fill="none" stroke="#9aa3ad" stroke-opacity=".35" stroke-width="1"/>
    <!-- porta per gli Starlink (pez dispenser) -->
    <rect x="54" y="205" width="26" height="74" rx="3" fill="#15181c" stroke="#5a626c" stroke-width="1.2"/>
    <path d="M57 214h20M57 270h20" stroke="#3a4048" stroke-width="1"/>
    <!-- fuliggine alla base -->
    <rect x="0" y="455" width="90" height="45" fill="#0c0a09" opacity=".35"/>
  </g>
  <!-- flap anteriori (V3: più piccoli e spostati sul lato sottovento) -->
  <path d="M10 92 L-14 116 L-15 166 L5 168 Z" fill="url(#sh-flap)" stroke="#40464e" stroke-width="1"/>
  <path d="M80 92 L100 114 L101 166 L86 168 Z" fill="#202429" stroke="#4a5058" stroke-width="1"/>
  <!-- perno di presa per la torre -->
  <rect x="90" y="176" width="7" height="10" rx="2" fill="#2f353d"/>
  <rect x="-6" y="176" width="6" height="10" rx="2" fill="#16191d"/>

  <!-- didascalie -->
  <g class="ann" font-size="28">
    <path d="M-17 140 H-70"/><circle cx="-17" cy="140" r="3"/>
    <text x="-76" y="136" text-anchor="end">Flap anteriori</text>
    <path d="M20 330 H-70"/><circle cx="20" cy="330" r="3"/>
    <text x="-76" y="326" text-anchor="end">Scudo termico</text><text x="-76" y="355" text-anchor="end" class="ann-s">piastrelle</text>
    <path d="M82 242 H130"/><circle cx="82" cy="242" r="3"/>
    <text x="136" y="238">Porta Starlink</text><text x="136" y="267" class="ann-s">26 Starlink V3</text>
    <path d="M98 181 H130"/><circle cx="98" cy="181" r="3"/>
    <text x="136" y="186">Perno di presa</text>
    <path d="M118 450 H130"/><circle cx="118" cy="450" r="3"/>
    <text x="136" y="446">Flap posteriori</text>
    <path d="M88 525 H130"/><circle cx="88" cy="525" r="3"/>
    <text x="136" y="530">6 Raptor 3</text><text x="136" y="559" class="ann-s">3 RVac + 3 mare</text>
  </g>
</svg>
