<svg xmlns="http://www.w3.org/2000/svg" viewBox="-290 -40 670 870" class="veh veh-booster" role="img" aria-label="Disegno di Super Heavy V3 (Booster 22)">
  <defs>
    <linearGradient id="bh-steel" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#3b424c"/><stop offset=".12" stop-color="#6d7681"/><stop offset=".33" stop-color="#d9dee4"/>
      <stop offset=".42" stop-color="#f4f6f8"/><stop offset=".55" stop-color="#bfc6ce"/><stop offset=".8" stop-color="#7a838e"/><stop offset="1" stop-color="#2e343c"/>
    </linearGradient>
    <linearGradient id="bh-steel-d" x1="0" x2="1">
      <stop offset="0" stop-color="#2a2f36"/><stop offset=".38" stop-color="#8d96a1"/><stop offset=".55" stop-color="#6f7882"/><stop offset="1" stop-color="#22272d"/>
    </linearGradient>
    <linearGradient id="bh-soot" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1a1410" stop-opacity="0"/><stop offset=".55" stop-color="#1a1410" stop-opacity=".35"/><stop offset="1" stop-color="#0d0a08" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="bh-bell" x1="0" x2="1">
      <stop offset="0" stop-color="#2b2622"/><stop offset=".4" stop-color="#8a7766"/><stop offset=".6" stop-color="#5d5047"/><stop offset="1" stop-color="#1e1a17"/>
    </linearGradient>
    <pattern id="bh-grid" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#20252c"/><path d="M0 0h7M0 0v7" stroke="#7c8792" stroke-width="1.4"/>
    </pattern>
    <radialGradient id="bh-flame" cx=".5" cy="0" r="1" fy="0">
      <stop offset="0" stop-color="#fff7e0"/><stop offset=".18" stop-color="#ffd27a"/><stop offset=".45" stop-color="#ff8a3d" stop-opacity=".85"/><stop offset="1" stop-color="#ff4d1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bh-core" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e8f2ff"/><stop offset=".5" stop-color="#9fc4ff" stop-opacity=".7"/><stop offset="1" stop-color="#6aa0ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="bh-blur" x="-50%" y="-20%" width="200%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="bh-body"><rect x="0" y="0" width="90" height="700"/></clipPath>
  </defs>

  <!-- fiamma (accesa solo durante le accensioni) -->
  <g class="flame">
    <ellipse cx="45" cy="790" rx="70" ry="95" fill="url(#bh-flame)" filter="url(#bh-blur)"/>
    <path d="M8 725 Q45 900 82 725 Z" fill="url(#bh-core)" opacity=".85"/>
    <g class="diamonds" fill="#fff6d8" opacity=".75">
      <ellipse cx="45" cy="760" rx="10" ry="4"/><ellipse cx="45" cy="790" rx="7" ry="3"/><ellipse cx="45" cy="815" rx="4" ry="2"/>
    </g>
  </g>

  <!-- motori Raptor 3 visibili -->
  <g>
    <path d="M4 700 h14 l3 26 h-20 z" fill="url(#bh-bell)"/>
    <path d="M19 700 h13 l3 30 h-19 z" fill="url(#bh-bell)"/>
    <path d="M33 700 h12 l3 33 h-18 z" fill="url(#bh-bell)"/>
    <path d="M45 700 h12 l3 33 h-18 z" fill="url(#bh-bell)" transform="translate(0 0)"/>
    <path d="M58 700 h13 l3 30 h-19 z" fill="url(#bh-bell)"/>
    <path d="M72 700 h14 l2 26 h-20 z" fill="url(#bh-bell)"/>
  </g>

  <!-- corpo del booster -->
  <g clip-path="url(#bh-body)">
    <rect x="0" y="0" width="90" height="700" fill="url(#bh-steel)"/>
    <!-- saldature -->
    <g stroke="#1d2228" stroke-opacity=".22" stroke-width="1">
      <path d="M0 64h90M0 86h90M0 108h90M0 130h90M0 152h90M0 174h90M0 196h90M0 218h90M0 240h90M0 262h90M0 284h90M0 306h90M0 328h90M0 350h90M0 372h90M0 394h90M0 416h90M0 438h90M0 460h90M0 482h90M0 504h90M0 526h90M0 548h90M0 570h90M0 592h90M0 614h90"/>
    </g>
    <!-- duomo comune tra serbatoio LOX e metano -->
    <path d="M0 300h90" stroke="#1d2228" stroke-opacity=".45" stroke-width="2.2"/>
    <!-- anello hot-staging integrato -->
    <rect x="0" y="0" width="90" height="48" fill="url(#bh-steel-d)"/>
    <g fill="#0d1014">
      <rect x="4" y="9" width="5" height="28" rx="1.5"/><rect x="14" y="9" width="6" height="28" rx="1.5"/><rect x="26" y="9" width="7" height="28" rx="1.5"/>
      <rect x="40" y="9" width="8" height="28" rx="1.5"/><rect x="55" y="9" width="7" height="28" rx="1.5"/><rect x="68" y="9" width="6" height="28" rx="1.5"/><rect x="80" y="9" width="5" height="28" rx="1.5"/>
    </g>
    <path d="M0 2h90M0 46h90" stroke="#0f1216" stroke-opacity=".6" stroke-width="2"/>
    <!-- condotto esterno -->
    <rect x="61" y="48" width="7" height="600" fill="#8f98a3"/>
    <rect x="61" y="48" width="2" height="600" fill="#eef1f4" opacity=".55"/>
    <rect x="66.5" y="48" width="1.5" height="600" fill="#2c3239" opacity=".6"/>
    <!-- griglia frontale -->
    <rect x="31" y="62" width="28" height="52" fill="url(#bh-grid)" stroke="#11151a" stroke-width="1.5"/>
    <!-- vano motori e fuliggine -->
    <rect x="0" y="560" width="90" height="140" fill="url(#bh-soot)"/>
    <path d="M0 640h90" stroke="#0d0f12" stroke-opacity=".5" stroke-width="2"/>
    <rect x="0" y="0" width="90" height="700" fill="url(#bh-steel)" opacity=".0"/>
  </g>
  <!-- chine -->
  <path d="M0 150 l-5 4 v280 l5 4z" fill="#59616b"/>
  <path d="M90 150 l5 4 v280 l-5 4z" fill="#3c434c"/>
  <!-- grid fin laterali -->
  <g stroke="#11151a" stroke-width="1.5">
    <path d="M0 60 L-34 66 L-34 116 L0 118 Z" fill="url(#bh-grid)"/>
    <path d="M90 60 L104 64 L104 114 L90 118 Z" fill="url(#bh-grid)"/>
  </g>
  <!-- punti di presa per le chopsticks -->
  <rect x="-7" y="126" width="7" height="10" rx="2" fill="#4a525c"/>
  <rect x="90" y="126" width="6" height="10" rx="2" fill="#2f353d"/>
  <!-- bordo superiore -->
  <rect x="2" y="-4" width="86" height="5" rx="2" fill="#8a939d"/>

  <!-- didascalie -->
  <g class="ann" font-size="31">
    <path d="M-38 90 H-70" /><circle cx="-38" cy="90" r="3"/>
    <text x="-76" y="85" text-anchor="end">Grid fin</text><text x="-76" y="117" text-anchor="end" class="ann-s">3 in totale (V3)</text>
    <path d="M92 24 H130" /><circle cx="92" cy="24" r="3"/>
    <text x="136" y="20">Anello</text><text x="136" y="52">hot-staging</text>
    <path d="M97 300 H130" /><circle cx="97" cy="300" r="3"/>
    <text x="136" y="296">Serbatoi</text><text x="136" y="328" class="ann-s">LOX + metano</text>
    <path d="M-8 300 H-70" /><circle cx="-8" cy="300" r="3"/>
    <text x="-76" y="296" text-anchor="end">Chine</text>
    <path d="M90 715 H130" /><circle cx="90" cy="715" r="3"/>
    <text x="136" y="711">33 Raptor 3</text><text x="136" y="743" class="ann-s">~72 m · 9 m</text>
  </g>
</svg>
